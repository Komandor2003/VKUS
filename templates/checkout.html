{% extends 'base.html' %}
{% block title %}Заказ оформлен{% endblock %}
{% block content %}
<div class="checkout-success">
  <h2>Спасибо за заказ!</h2>
  <p>Номер заказа: <span class="order-id">#{{ order.id }}</span></p>
  <p>Сумма: <span class="order-total">{{ order.total_price }} ₽</span></p>
  <a href="{{ url_for('menu') }}" class="btn btn-primary">Вернуться в меню</a>
</div>
{% endblock %}
